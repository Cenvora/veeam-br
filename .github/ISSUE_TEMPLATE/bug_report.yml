name: Bug report
description: A request fails, a response doesn't parse, or the client behaves unexpectedly
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this.

        Using the Home Assistant integration? Problems with entities or setup belong in
        [ha-veeam-br](https://github.com/Cenvora/ha-veeam-br/issues). Report here when the
        library itself fails: a request error, a model that rejects a real response, or an
        authentication problem.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: "What you expected, and what happened instead."
    validations:
      required: true

  - type: textarea
    id: code
    attributes:
      label: Minimal code to reproduce
      placeholder: |
        from veeam_br.client import VeeamClient
        …
      render: python
    validations:
      required: false

  - type: input
    id: sdk-version
    attributes:
      label: veeam-br version
      description: "`pip show veeam-br`"
    validations:
      required: true

  - type: dropdown
    id: api-version
    attributes:
      label: API version
      options:
        - "1.3-rev2"
        - "1.3-rev1"
        - "1.3-rev0"
        - "1.2-rev1"
        - "Not sure"
    validations:
      required: true

  - type: input
    id: product-version
    attributes:
      label: Veeam Backup & Replication version
      description: "Full build number of the server you are talking to."
      placeholder: "13.1.0.411"
    validations:
      required: true

  - type: input
    id: python-version
    attributes:
      label: Python version
      placeholder: "3.13.7"
    validations:
      required: true

  - type: textarea
    id: traceback
    attributes:
      label: Traceback or error
      description: "The full traceback. Redact hostnames and tokens."
      render: text
    validations:
      required: false

  - type: textarea
    id: response
    attributes:
      label: Server response
      description: |
        If a model fails to parse, the raw JSON the server sent (redacted) makes this far
        quicker to fix.
      render: json
    validations:
      required: false
